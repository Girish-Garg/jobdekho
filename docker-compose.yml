# One `docker compose up --build` brings up Postgres and the app, migrates a
# fresh volume, and serves the dashboard on http://localhost:3000. Every
# ${VAR:-default} below reads .env in this directory (see .env.example); with
# no .env at all the defaults are a complete, working local setup.
services:
  db:
    # pgvector's build of Postgres 17. The extension is not used yet; taking
    # the image now makes adopting it later a `create extension`, not a data
    # migration to a different image.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobdekho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobdekho}
      POSTGRES_DB: ${POSTGRES_DB:-jobdekho}
    volumes:
      # Named, so the data outlives `docker compose down` and an image
      # rebuild. Only `docker compose down -v` removes it.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published so host-side tools (psql, npm run scrape, npm run db:push)
      # can reach the same database the container uses.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # -h forces a TCP check. During first-run initdb the postgres image
      # runs a temporary server on the unix socket only, so a socket check
      # reports healthy too early and the app connects into the gap before
      # the real server is listening. $$ is compose escaping: these read the
      # container's own environment, not the host's.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    # A real init as PID 1, so `docker compose stop` reaches node as SIGTERM
    # instead of waiting out the 10s kill timeout.
    init: true
    depends_on:
      db:
        condition: service_healthy
    # Whatever is in .env (Google, Telegram, Adzuna, DEV_AUTH_USER_ID) reaches
    # the container as-is. Optional so a checkout with no .env still starts.
    env_file:
      - path: .env
        required: false
    # Pinned here so they win over .env: inside compose the database is always
    # the db service, whatever DATABASE_URL on the host points at.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-jobdekho}:${POSTGRES_PASSWORD:-jobdekho}@db:5432/${POSTGRES_DB:-jobdekho}
      PORT: "3000"
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-secret}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Optional: the host's Claude Code credentials, for the AI features
      # planned on top of this. Read-write because the CLI refreshes its own
      # token in place. The app starts fine without it - if the directory
      # does not exist on the host, Docker creates an empty one.
      - ~/.claude:/home/node/.claude

volumes:
  pgdata:
