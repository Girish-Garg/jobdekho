<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JobDekho's mark: J and D hanging from one headline bar, the way
       Devanagari letters hang from their shirorekha, J in white and D in the
       app's saffron. Drawn as strokes, not type, since a favicon cannot load
       the site's fonts. The dark tile suits light and dark tab bars alike. -->
  <style>
    .tile { fill: rgb(22 24 29); }
    .white { fill: rgb(255 248 236); }
    .saffron { fill: rgb(255 159 28); }
    .j { fill: none; stroke: rgb(255 248 236); stroke-width: 7; stroke-linecap: round; }
    .d { fill: none; stroke: rgb(255 159 28); stroke-width: 7; stroke-linecap: square; stroke-linejoin: miter; }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <rect class="white" x="6" y="12" width="28" height="7" />
  <rect class="saffron" x="34" y="12" width="24" height="7" />
  <path class="j" d="M22 19v18c0 7-3 10-9 10" />
  <path class="d" d="M38.5 19v30h2.5c8.5 0 13-5.5 13-15s-4.5-15-13-15" />
</svg>
