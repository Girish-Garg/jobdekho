<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- JobDekho's mark: a bold J and D, the J in cream for Job and the D in
       the app's saffron for Dekho, split the way the wordmark splits them.
       Drawn on a 32 grid with every straight edge on a whole pixel at 16px,
       so the tab icon stays sharp and the D keeps its counter open; a
       favicon cannot load the site's fonts in any case. The graphite tile
       carries the letters on light and dark tab bars alike. -->
  <rect width="32" height="32" rx="7" fill="rgb(22 24 29)" />
  <path fill="rgb(255 248 236)" d="M8 4h4v18c0 4-2 6-6 6H4v-4h2c1.5 0 2-.5 2-2z" />
  <path fill="rgb(255 159 28)" fill-rule="evenodd" d="M16 4h5c5 0 7 5 7 12s-2 12-7 12h-5zm4 4v16h1c2.5 0 3-3 3-8s-.5-8-3-8z" />
</svg>
